<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order | Hind Pharma</title><style>body{font-family:system-ui;background:#f5fbf9;color:#17332d;margin:0}.wrap{width:min(700px,92%);margin:30px auto}.box{background:#fff;border:1px solid #dcebe6;border-radius:20px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.back{font-weight:800;color:#076a59;text-decoration:none}.logout{border:1px solid #dcebe6;background:#fff;color:#b33;border-radius:10px;padding:8px 11px;font-weight:800}.user{font-size:12px;color:#71827e;margin:12px 0}.medical{font-size:13px;color:#71827e;margin:7px 0 18px}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e8f0ee}.qty{display:flex;gap:8px;align-items:center}.qty button{border:1px solid #dcebe6;background:#fff;border-radius:8px;padding:5px 9px}.remove{color:#b33;border:0;background:none}.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#108c74;color:#fff;font-weight:900;font-size:15px}</style></head><body><div class="wrap"><div class="top"><a class="back" href="products.html">← Add more products</a><button class="logout" onclick="logout()">LOGOUT</button></div><div class="box" style="margin-top:18px"><div class="user">Logged in as: <strong id="user"></strong></div><h1>Current Order</h1><div class="medical" id="medical"></div><div id="list"></div><button class="primary" id="next">FINAL ORDER</button></div></div><script>const SESSION_HOURS=12;function validSession(){const u=sessionStorage.getItem('hindPharmaUser'),at=Number(localStorage.getItem('hindPharmaLoginAt')||0);if(!u||!at||Date.now()-at>=SESSION_HOURS*60*60*1000){sessionStorage.removeItem('hindPharmaUser');localStorage.removeItem('hindPharmaLoginAt');return false}return true}function logout(){sessionStorage.removeItem('hindPharmaUser');localStorage.removeItem('hindPharmaLoginAt');localStorage.removeItem('hindPharmaOrder');localStorage.removeItem('hindPharmaMedical');location.href='index.html'}if(!validSession())location.replace('login.html');document.getElementById('user').textContent=sessionStorage.getItem('hindPharmaUser')||'';let order=JSON.parse(localStorage.getItem('hindPharmaOrder')||'[]'),list=document.getElementById('list');document.getElementById('medical').textContent='Medical: '+(localStorage.getItem('hindPharmaMedical')||'Not selected');function render(){list.innerHTML=order.length?order.map((x,i)=>`<div class="item"><span>${i+1}. ${x.name}</span><span class="qty"><button onclick="change(${i},-1)">−</button>${x.quantity}<button onclick="change(${i},1)">+</button><button class="remove" onclick="removeItem(${i})">×</button></span></div>`).join(''):'<p>Your order is empty.</p>';document.getElementById('next').disabled=!order.length}window.change=(i,n)=>{order[i].quantity=Math.max(1,order[i].quantity+n);save()};window.removeItem=i=>{order.splice(i,1);save()};function save(){localStorage.setItem('hindPharmaOrder',JSON.stringify(order));render()}document.getElementById('next').onclick=()=>location.href='final-order.html';render();setInterval(()=>{if(!validSession())location.replace('login.html')},60000)</script></body></html>
