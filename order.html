<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order | Hind Pharma</title><style>body{font-family:system-ui;background:#f5fbf9;color:#17332d;margin:0}.wrap{width:min(700px,92%);margin:30px auto}.box{background:#fff;border:1px solid #dcebe6;border-radius:20px;padding:22px}.back{font-weight:800;color:#076a59;text-decoration:none}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e8f0ee}.qty{display:flex;gap:8px;align-items:center}.qty button{border:1px solid #dcebe6;background:#fff;border-radius:8px;padding:5px 9px}.remove{color:#b33;border:0;background:none}.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#108c74;color:#fff;font-weight:900;font-size:15px}</style></head><body><div class="wrap"><a class="back" href="products.html">← Add more products</a><div class="box" style="margin-top:18px"><h1>Current Order</h1><div id="list"></div><button class="primary" id="next">FINAL ORDER</button></div></div><script>let order=JSON.parse(localStorage.getItem('hindPharmaOrder')||'[]'),list=document.getElementById('list');function render(){list.innerHTML=order.length?order.map((x,i)=>`<div class="item"><span>${i+1}. ${x.name}</span><span class="qty"><button onclick="change(${i},-1)">−</button>${x.quantity}<button onclick="change(${i},1)">+</button><button class="remove" onclick="removeItem(${i})">×</button></span></div>`).join(''):'<p>Your order is empty.</p>';document.getElementById('next').disabled=!order.length}window.change=(i,n)=>{order[i].quantity=Math.max(1,order[i].quantity+n);save()};window.removeItem=i=>{order.splice(i,1);save()};function save(){localStorage.setItem('hindPharmaOrder',JSON.stringify(order));render()}document.getElementById('next').onclick=()=>location.href='medical.html';render()</script></body></html>
