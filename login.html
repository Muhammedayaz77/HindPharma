<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Hind Pharma</title><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5fbf9;color:#17332d;min-height:100vh;display:grid;place-items:center}.box{width:min(390px,86%);background:#fff;border:1px solid #dcebe6;border-radius:22px;padding:26px;box-shadow:0 12px 35px rgba(17,74,62,.08)}h1{margin:0;font-size:30px}.sub{color:#667a75;margin:6px 0 24px}label{display:block;font-size:12px;font-weight:900;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dcebe6;border-radius:12px;outline:0}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:#108c74;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.error{color:#b33;font-size:13px;margin-top:12px;min-height:18px}.home{display:block;text-align:center;margin-top:16px;color:#076a59;font-weight:800;text-decoration:none;font-size:13px}</style></head><body><main class="box"><h1>HIND PHARMA</h1><div class="sub">Login to start taking an order</div><form id="form"><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">LOGIN</button><div class="error" id="error"></div></form><a class="home" href="index.html">← Back to Home</a></main><script>const users=[{username:'HindPharma',password:'123'},{username:'Ayaz',password:'ayaz123'}];document.getElementById('form').onsubmit=e=>{e.preventDefault();let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,ok=users.find(x=>x.username===u&&x.password===p);if(!ok){document.getElementById('error').textContent='Invalid username or password.';return}sessionStorage.setItem('hindPharmaUser',u);localStorage.setItem('hindPharmaLoginAt',String(Date.now()));location.href='medical.html'};</script></body></html>
