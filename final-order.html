<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy Order | Hind Pharma</title><style>body{font-family:system-ui;background:#f5fbf9;color:#17332d;margin:0}.wrap{width:min(650px,92%);margin:30px auto}.box{background:#fff;border:1px solid #dcebe6;border-radius:20px;padding:22px}.back{font-weight:800;color:#076a59;text-decoration:none}.preview{margin-top:18px;background:#f7fbfa;border:1px solid #dcebe6;border-radius:14px;padding:18px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7}.primary,.whatsapp{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.primary{background:#108c74}.whatsapp{background:#25D366}.secondary{width:100%;margin-top:10px;padding:12px;border:1px solid #dcebe6;border-radius:12px;background:#fff;font-weight:800;cursor:pointer}</style></head><body><div class="wrap"><a class="back" href="medical.html">← Change medical</a><div class="box" style="margin-top:18px"><h1>Final Order</h1><div class="preview" id="preview"></div><button class="primary" id="copy">COPY ORDER</button><button class="whatsapp" id="whatsapp">SEND ON WHATSAPP</button><button class="secondary" id="new">START NEW ORDER</button></div></div><script>let order=JSON.parse(localStorage.getItem('hindPharmaOrder')||'[]'),medical=localStorage.getItem('hindPharmaMedical')||'MEDICAL NAME';let text=`*#${medical}*\n\n`+order.map((x,i)=>`${i+1}. ${x.name} ----> ${x.quantity}`).join('\n');document.getElementById('preview').textContent=text;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text)}catch(e){let t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('copy').textContent='✓ COPIED';setTimeout(()=>document.getElementById('copy').textContent='COPY ORDER',1500)};document.getElementById('whatsapp').onclick=()=>{window.location.href='https://wa.me/919028773301?text='+encodeURIComponent(text)};document.getElementById('new').onclick=()=>{localStorage.removeItem('hindPharmaOrder');localStorage.removeItem('hindPharmaMedical');location.href='products.html'}</script></body></html>
