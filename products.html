<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Hind Pharma product list">
<title>Products | Hind Pharma</title>
<style>
:root{--green:#108c74;--dark:#076a59;--soft:#e9f8f3;--ink:#17332d;--muted:#667a75;--line:#dcebe6;--bg:#f5fbf9}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}a{text-decoration:none;color:inherit}.container{width:min(1100px,92%);margin:auto}.header{position:sticky;top:0;z-index:10;background:rgba(245,251,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.03em}.back{color:var(--dark);font-weight:800;font-size:14px}.hero{padding:34px 0 20px}.eyebrow{color:var(--dark);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,52px);line-height:1.05;margin-top:7px;letter-spacing:-.04em}.hero p{color:var(--muted);margin-top:9px}.search{position:relative;margin-top:22px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px 18px 15px 45px;outline:none;box-shadow:0 8px 24px rgba(17,74,62,.06)}.search input:focus{border-color:var(--green)}.search span{position:absolute;left:17px;top:13px;font-size:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0}.count{color:var(--muted);font-size:13px;font-weight:700}.cart{border:0;background:var(--green);color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding-bottom:100px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:0 8px 25px rgba(17,74,62,.05)}.name{font-weight:900;font-size:16px;line-height:1.3}.company{font-size:12px;color:var(--dark);font-weight:800;margin-top:7px}.formula{font-size:13px;color:var(--muted);margin-top:7px;min-height:20px}.mrp{font-size:13px;margin-top:8px;font-weight:800}.select{width:100%;margin-top:14px;border:0;background:var(--soft);color:var(--dark);border-radius:11px;padding:11px;font-weight:900;cursor:pointer}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(10,35,30,.48);display:none;align-items:end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{background:#fff;width:min(520px,100%);border-radius:24px 24px 0 0;padding:24px}.sheet h2{font-size:22px}.sheet p{color:var(--muted);font-size:13px;margin-top:5px}.qty{display:flex;align-items:center;gap:14px;margin-top:20px}.qty button{width:44px;height:44px;border:1px solid var(--line);background:#f8fcfb;border-radius:12px;font-size:22px;cursor:pointer}.qty input{width:80px;text-align:center;padding:11px;border:1px solid var(--line);border-radius:12px}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;padding:13px;border-radius:12px;font-weight:900;cursor:pointer}.cancel{border:1px solid var(--line);background:#fff}.add{border:0;background:var(--green);color:#fff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding-top:27px}.card{padding:17px}}
</style>
</head>
<body>
<header class="header"><div class="container nav"><a class="back" href="index.html">← Home</a><div class="brand">HIND PHARMA</div><button class="cart" id="cartBtn">Order (0)</button></div></header>
<main class="container"><section class="hero"><div class="eyebrow">Product Catalogue</div><h1>Select Products</h1><p>Search the product name, company or formula and add the required quantity.</p><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search product..." autocomplete="off"></div><div class="toolbar"><div class="count" id="count">Loading products...</div></div></section><section class="grid" id="grid"></section></main>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalName"></h2><p id="modalInfo"></p><div class="qty"><button id="minus">−</button><input id="qty" type="number" min="1" value="1"><button id="plus">+</button></div><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="add" id="add">Add to Order</button></div></div></div>
<script>
let products=[],filtered=[],order=JSON.parse(localStorage.getItem('hindPharmaOrder')||'[]'),selected=null;
const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),modal=document.getElementById('modal'),qty=document.getElementById('qty');
function updateCart(){document.getElementById('cartBtn').textContent=`Order (${order.length})`}
function render(){let q=search.value.trim().toLowerCase();filtered=products.filter(p=>`${p.name||''} ${p.company||''} ${p.formula||''}`.toLowerCase().includes(q));count.textContent=`${filtered.length} product${filtered.length===1?'':'s'} found`;grid.innerHTML=filtered.length?filtered.map((p,i)=>`<article class="card"><div class="name">${esc(p.name||'Unnamed Product')}</div>${p.company?`<div class="company">${esc(p.company)}</div>`:''}${p.formula?`<div class="formula">${esc(p.formula)}</div>`:''}${p.mrp!=null&&p.mrp!==''?`<div class="mrp">MRP: ₹${esc(String(p.mrp))}</div>`:''}<button class="select" data-index="${i}">SELECT</button></article>`).join(''):'<div class="empty">No matching products found.</div>';grid.querySelectorAll('.select').forEach(b=>b.addEventListener('click',()=>openProduct(Number(b.dataset.index))))}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openProduct(i){selected=filtered[i];document.getElementById('modalName').textContent=selected.name||'Product';document.getElementById('modalInfo').textContent=[selected.company,selected.formula,selected.mrp!=null?`MRP ₹${selected.mrp}`:''].filter(Boolean).join(' • ');qty.value=1;modal.classList.add('show');qty.focus()}
document.getElementById('minus').onclick=()=>qty.value=Math.max(1,(+qty.value||1)-1);document.getElementById('plus').onclick=()=>qty.value=(+qty.value||1)+1;document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('add').onclick=()=>{let n=Math.max(1,parseInt(qty.value)||1),key=selected.id||selected.name,old=order.find(x=>x.key===key);if(old)old.quantity+=n;else order.push({key,name:selected.name,quantity:n});localStorage.setItem('hindPharmaOrder',JSON.stringify(order));updateCart();modal.classList.remove('show')};search.addEventListener('input',render);document.getElementById('cartBtn').onclick=()=>location.href='order.html';
fetch('data/products.json').then(r=>r.json()).then(d=>{products=d;render()}).catch(()=>{count.textContent='Could not load products';grid.innerHTML='<div class="empty">Product data could not be loaded.</div>'});updateCart();
</script>
</body></html>
