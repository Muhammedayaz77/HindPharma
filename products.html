<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Hind Pharma product list"><title>Products | Hind Pharma</title><style>:root{--green:#108c74;--dark:#076a59;--soft:#e9f8f3;--ink:#17332d;--muted:#667a75;--line:#dcebe6;--bg:#f5fbf9}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}a{text-decoration:none;color:inherit}.container{width:min(1100px,92%);margin:auto}.header{position:sticky;top:0;z-index:10;background:rgba(245,251,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.03em}.back{color:var(--dark);font-weight:800;font-size:14px}.medicalTag{font-size:12px;color:var(--dark);font-weight:800;text-align:center;flex:1}.cart{border:0;background:var(--green);color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.hero{padding:34px 0 20px}.eyebrow{color:var(--dark);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,52px);line-height:1.05;margin-top:7px;letter-spacing:-.04em}.hero p{color:var(--muted);margin-top:9px}.search{position:relative;margin-top:22px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px 18px 15px 45px;outline:none;box-shadow:0 8px 24px rgba(17,74,62,.06)}.search input:focus{border-color:var(--green)}.search span{position:absolute;left:17px;top:13px;font-size:20px}.toolbar{margin:18px 0}.count{color:var(--muted);font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding-bottom:100px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:0 8px 25px rgba(17,74,62,.05)}.name{font-weight:900;font-size:16px;line-height:1.3}.company{font-size:12px;color:var(--dark);font-weight:800;margin-top:7px}.formula{font-size:13px;color:var(--muted);margin-top:7px}.mrp{font-size:13px;margin-top:8px;font-weight:800}.select{width:100%;margin-top:14px;border:0;background:var(--soft);color:var(--dark);border-radius:11px;padding:11px;font-weight:900;cursor:pointer}.manual{grid-column:1/-1;background:#fff;border:1px dashed var(--green);border-radius:18px;padding:20px;text-align:center}.manual strong{display:block;font-size:16px}.manual p{color:var(--muted);font-size:13px;margin:5px 0 13px}.manual button{border:0;background:var(--green);color:#fff;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(10,35,30,.48);display:none;align-items:end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{background:#fff;width:min(520px,100%);border-radius:24px 24px 0 0;padding:24px}.sheet h2{font-size:22px}.sheet p{color:var(--muted);font-size:13px;margin-top:5px}.qty{display:flex;align-items:center;gap:14px;margin-top:20px}.qty button{width:44px;height:44px;border:1px solid var(--line);background:#f8fcfb;border-radius:12px;font-size:22px;cursor:pointer}.qty input{width:80px;text-align:center;padding:11px;border:1px solid var(--line);border-radius:12px}.manualName{width:100%;margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:12px;outline:none}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;padding:13px;border-radius:12px;font-weight:900;cursor:pointer}.cancel{border:1px solid var(--line);background:#fff}.add{border:0;background:var(--green);color:#fff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding-top:27px}.medicalTag{display:none}.card{padding:17px}}</style></head><body><header class="header"><div class="container nav"><a class="back" href="medical.html">← Medical</a><div class="brand">HIND PHARMA</div><div class="medicalTag" id="medicalTag"></div><button class="cart" id="cartBtn">Order (0)</button></div></header><main class="container"><section class="hero"><div class="eyebrow">Product Catalogue</div><h1>Select Products</h1><p id="intro">Search the product name, company or formula and add the required quantity.</p><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search product..." autocomplete="off"></div><div class="toolbar"><div class="count" id="count">Loading products...</div></div></section><section class="grid" id="grid"></section></main><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Add Product</h2><p id="modalInfo">Add a product to this order.</p><input id="manualName" class="manualName" placeholder="Product name" autocomplete="off" style="display:none"><div class="qty"><button id="minus">−</button><input id="qty" type="number" min="1" value="1"><button id="plus">+</button></div><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="add" id="add">Add to Order</button></div></div></div><script>const SESSION_HOURS=12;function validSession(){const u=sessionStorage.getItem('hindPharmaUser'),at=Number(localStorage.getItem('hindPharmaLoginAt')||0);if(!u||!at||Date.now()-at>=SESSION_HOURS*60*60*1000){sessionStorage.removeItem('hindPharmaUser');localStorage.removeItem('hindPharmaLoginAt');return false}return true}if(!validSession())location.replace('login.html');const medical=localStorage.getItem('hindPharmaMedical');if(!medical)location.replace('medical.html');let products=[],filtered=[],order=JSON.parse(localStorage.getItem('hindPharmaOrder')||'[]'),selected=null,manualMode=false;const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),modal=document.getElementById('modal'),qty=document.getElementById('qty'),manualName=document.getElementById('manualName');document.getElementById('medicalTag').textContent=medical||'';document.getElementById('intro').textContent=`Ordering for ${medical||'selected medical'}. Search a product and add the required quantity.`;function updateCart(){document.getElementById('cartBtn').textContent=`Order (${order.length})`}function esc(s){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){let q=search.value.trim().toLowerCase();filtered=products.filter(p=>`${p.name||''} ${p.company||''} ${p.formula||''}`.toLowerCase().includes(q));count.textContent=`${filtered.length} product${filtered.length===1?'':'s'} found`;let cards=filtered.map((p,i)=>`<article class="card"><div class="name">${esc(p.name||'Unnamed Product')}</div>${p.company?`<div class="company">${esc(p.company)}</div>`:''}${p.formula?`<div class="formula">${esc(p.formula)}</div>`:''}${p.mrp!=null&&p.mrp!==''?`<div class="mrp">MRP: ₹${esc(String(p.mrp))}</div>`:''}<button class="select" data-index="${i}">SELECT</button></article>`).join('');let manual=q?`<div class="manual"><strong>Product not in the list?</strong><p>You can still take the order by adding it manually.</p><button id="manualBtn">+ ADD PRODUCT MANUALLY</button></div>`:'';grid.innerHTML=(cards||'<div class="empty">No matching products found.</div>')+manual;grid.querySelectorAll('.select').forEach(b=>b.addEventListener('click',()=>openProduct(Number(b.dataset.index))));document.getElementById('manualBtn')?.addEventListener('click',openManual)}function openProduct(i){manualMode=false;selected=filtered[i];document.getElementById('modalTitle').textContent=selected.name||'Product';document.getElementById('modalInfo').textContent=[selected.company,selected.formula,selected.mrp!=null?`MRP ₹${selected.mrp}`:''].filter(Boolean).join(' • ');manualName.style.display='none';qty.value=1;modal.classList.add('show')}function openManual(){manualMode=true;selected=null;document.getElementById('modalTitle').textContent='Add Product Manually';document.getElementById('modalInfo').textContent='This product will be added only to the current order.';manualName.style.display='block';manualName.value=search.value.trim();qty.value=1;modal.classList.add('show');setTimeout(()=>manualName.focus(),50)}document.getElementById('minus').onclick=()=>qty.value=Math.max(1,(+qty.value||1)-1);document.getElementById('plus').onclick=()=>qty.value=(+qty.value||1)+1;document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('add').onclick=()=>{let n=Math.max(1,parseInt(qty.value)||1),name=manualMode?manualName.value.trim():selected?.name;if(!name)return;let key=(manualMode?'manual:':'product:')+name.toUpperCase(),old=order.find(x=>x.key===key);if(old)old.quantity+=n;else order.push({key,name,quantity:n,manual:manualMode});localStorage.setItem('hindPharmaOrder',JSON.stringify(order));updateCart();modal.classList.remove('show')};search.addEventListener('input',render);document.getElementById('cartBtn').onclick=()=>location.href='order.html';fetch('data/products.json').then(r=>r.json()).then(d=>{products=Array.isArray(d)?d:[];render()}).catch(()=>{count.textContent='Could not load products';grid.innerHTML='<div class="empty">Product data could not be loaded.</div>'});updateCart();setInterval(()=>{if(!validSession())location.replace('login.html')},60000);</script></body></html>
