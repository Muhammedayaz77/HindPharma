name: Prepare Hind Pharma Data

on:
  push:
    paths:
      - 'OLD_HindPharmaDataFile'
      - 'scripts/prepare_products.py'
      - '.github/workflows/prepare-products.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate JSON data tables
        run: python scripts/prepare_products.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/companies.json data/suppliers.json data/inventory.json data/purchases.json
          git diff --cached --quiet || git commit -m "Generate Hind Pharma JSON data tables"
          git push
