name: Native Client Builds

on:
  push:
    branches:
      - main
      - native-platform-setup
    paths:
      - 'web/**'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/native-builds.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/native-builds.yml'
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile all client backends
        run: python -m compileall -q web/Backend android/Backend ios/Backend

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'
      - name: Build Android debug APK
        run: gradle -p android assembleDebug

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build iOS app
        run: xcodebuild -project ios/HindPharmaApp.xcodeproj -scheme HindPharmaApp -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
