<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Medical | Hind Pharma</title><style>body{font-family:system-ui;background:#f5fbf9;color:#17332d;margin:0}.wrap{width:min(700px,92%);margin:30px auto}.box{background:#fff;border:1px solid #dcebe6;border-radius:20px;padding:22px}.back{font-weight:800;color:#076a59;text-decoration:none}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dcebe6;border-radius:13px;margin:18px 0;outline:0}.medical{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dcebe6;border-radius:13px;padding:14px;margin:9px 0;font-weight:800;cursor:pointer}.medical span{display:block;color:#71827e;font-size:12px;font-weight:600;margin-top:3px}.empty{color:#71827e;text-align:center;padding:25px}</style></head><body><div class="wrap"><a class="back" href="order.html">← Back to order</a><div class="box" style="margin-top:18px"><h1>Select Medical</h1><input id="search" placeholder="Search medical..." autocomplete="off"><div id="list">Loading...</div></div></div><script>let medicals=[],search=document.getElementById('search'),list=document.getElementById('list');function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){let q=search.value.trim().toLowerCase();let a=medicals.filter(x=>`${x.name||''} ${x.area||''}`.toLowerCase().includes(q));list.innerHTML=a.length?a.map((x,i)=>`<button class="medical" data-index="${i}">${esc(x.name||'')}</button>`).join(''):'<div class="empty">No medical found.</div>';list.querySelectorAll('.medical').forEach(b=>b.addEventListener('click',()=>choose(a[Number(b.dataset.index)])))}function choose(medical){localStorage.setItem('hindPharmaMedical',medical.name||'MEDICAL NAME');location.href='final-order.html'}search.oninput=render;fetch('data/medicals.json').then(r=>r.json()).then(d=>{medicals=Array.isArray(d)?d:[];render()}).catch(()=>list.innerHTML='<div class="empty">Medical list could not be loaded.</div>')</script></body></html>
